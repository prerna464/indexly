name: Update Market Data

on:
  schedule:
    - cron: "30 12 * * 1-5"   # 12:30 UTC = 6:00 PM IST, Mon–Fri (after major markets close)
  workflow_dispatch:            # lets you also trigger this manually from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run update script
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node update-market-data.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/js/market-data.js
          git diff --cached --quiet || git commit -m "Auto-update market data $(date -u +'%Y-%m-%d')"
          git push
